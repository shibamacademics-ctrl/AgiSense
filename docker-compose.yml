services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agisense-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://agisense:agisense_password@postgres:5432/agisense_db
      - JWT_SECRET=agrisense-production-secret-replace-me
      - FRONTEND_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: agisense-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agisense-db
    environment:
      - POSTGRES_USER=agisense
      - POSTGRES_PASSWORD=agisense_password
      - POSTGRES_DB=agisense_db
    ports:
      - "5432:5432"
    volumes:
      - agisense_pgdata:/var/lib/postgresql/data
      - ./Backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agisense -d agisense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  agisense_pgdata:
