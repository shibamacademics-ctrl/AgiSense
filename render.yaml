services:
  - type: web
    name: agisense-app
    runtime: docker
    plan: free
    region: oregon
    branch: copy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://agrisense-ruddy-three.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: agisense-postgres
          property: connectionString

databases:
  - name: agisense-postgres
    plan: free
    region: oregon
    databaseName: agisense_db
    user: agisense
